[build]
builder = "DOCKERFILE"
dockerfilePath = "docker/app.Dockerfile"

[deploy]
startCommand = "java -Xmx512m -Dmanagement.tracing.enabled=false -jar app.jar"
healthcheckPath = "/actuator/health/liveness"
healthcheckTimeout = 120
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5
numReplicas = 1
