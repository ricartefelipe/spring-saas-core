app:
  dev:
    token-endpoint-enabled: true
  auth:
    mode: hs256

spring:
  liquibase:
    # local + seed: schema, 008 (essencial), 009 (dados realistas) para testar ao máximo
    contexts: local,seed

logging:
  pattern:
    console: "%d{HH:mm:ss.SSS} [%thread] %-5level %logger{36} [%X{correlationId:-}] [%X{tenantId:-}] - %msg%n"
