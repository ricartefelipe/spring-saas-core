# =============================================================================
# spring-saas-core — Production Profile
# =============================================================================
# Required environment variables:
#   DB_URL                  — PostgreSQL JDBC URL
#   DB_USER                 — Database username
#   DB_PASS                 — Database password
#   REDIS_HOST              — Redis host
#   RABBITMQ_HOST           — RabbitMQ host
#   RABBITMQ_USER           — RabbitMQ username
#   RABBITMQ_PASS           — RabbitMQ password
#   OIDC_ISSUER_URI         — OIDC provider issuer URL (e.g. Keycloak)
#   OIDC_JWK_SET_URI        — JWKS endpoint for token verification
#   OIDC_CLIENT_ID          — OIDC client ID
#   CORS_ALLOWED_ORIGINS    — Comma-separated allowed origins (e.g. https://app.example.com)
# Optional:
#   SERVER_PORT             — Server port (default 8080)
#   REDIS_PORT              — Redis port (default 6379)
#   RABBITMQ_PORT           — RabbitMQ port (default 5672)
#   OIDC_AUDIENCE           — OIDC audience claim
#   OUTBOX_PUBLISH_ENABLED  — Enable outbox publishing (default false)
# =============================================================================

spring:
  liquibase:
    contexts: prod

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:}
  dev:
    token-endpoint-enabled: false
  auth:
    mode: oidc
  rate-limit:
    free: 30
    pro: 200
    enterprise: 600

logging:
  level:
    root: WARN
    com.union.solutions: INFO
  pattern:
    console: '{"timestamp":"%d{yyyy-MM-dd''T''HH:mm:ss.SSSZ}","level":"%level","logger":"%logger","thread":"%thread","correlationId":"%X{correlationId:-}","tenantId":"%X{tenantId:-}","message":"%msg"}%n'
