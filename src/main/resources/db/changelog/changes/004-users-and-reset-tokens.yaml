databaseChangeLog:
  - changeSet:
      id: phase2-001-users
      author: saascore
      changes:
        - createTable:
            tableName: users
            columns:
              - column:
                  name: id
                  type: uuid
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: email
                  type: varchar(255)
                  constraints:
                    nullable: false
                    unique: true
              - column:
                  name: name
                  type: varchar(255)
                  constraints:
                    nullable: false
              - column:
                  name: password_hash
                  type: varchar(255)
                  constraints:
                    nullable: false
              - column:
                  name: tenant_id
                  type: uuid
                  constraints:
                    nullable: false
              - column:
                  name: roles
                  type: varchar(1024)
                  defaultValue: ""
              - column:
                  name: status
                  type: varchar(32)
                  defaultValue: ACTIVE
              - column:
                  name: created_at
                  type: timestamp with time zone
                  defaultValueComputed: CURRENT_TIMESTAMP
              - column:
                  name: updated_at
                  type: timestamp with time zone
                  defaultValueComputed: CURRENT_TIMESTAMP
        - createIndex:
            indexName: idx_users_email
            tableName: users
            unique: true
            columns:
              - column:
                  name: email
        - createIndex:
            indexName: idx_users_tenant_id
            tableName: users
            columns:
              - column:
                  name: tenant_id
        - createIndex:
            indexName: idx_users_status
            tableName: users
            columns:
              - column:
                  name: status
        - addForeignKeyConstraint:
            constraintName: fk_users_tenant
            baseTableName: users
            baseColumnNames: tenant_id
            referencedTableName: tenants
            referencedColumnNames: id

  - changeSet:
      id: phase2-002-password-reset-tokens
      author: saascore
      changes:
        - createTable:
            tableName: password_reset_tokens
            columns:
              - column:
                  name: id
                  type: uuid
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: user_id
                  type: uuid
                  constraints:
                    nullable: false
              - column:
                  name: token_hash
                  type: varchar(255)
                  constraints:
                    nullable: false
              - column:
                  name: used
                  type: boolean
                  defaultValueBoolean: false
              - column:
                  name: expires_at
                  type: timestamp with time zone
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: timestamp with time zone
                  defaultValueComputed: CURRENT_TIMESTAMP
        - createIndex:
            indexName: idx_reset_tokens_user_id
            tableName: password_reset_tokens
            columns:
              - column:
                  name: user_id
        - addForeignKeyConstraint:
            constraintName: fk_reset_tokens_user
            baseTableName: password_reset_tokens
            baseColumnNames: user_id
            referencedTableName: users
            referencedColumnNames: id
