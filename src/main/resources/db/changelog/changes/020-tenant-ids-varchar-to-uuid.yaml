databaseChangeLog:
  - changeSet:
      id: tenant-ids-varchar-to-uuid
      author: saascore
      comment: >
        Convert tenants.id and all tenant_id columns from varchar to uuid.
        Replaces 'tenant_demo' with a well-known UUID.
        Idempotent: skips columns already typed as uuid.
      changes:
        - sql:
            splitStatements: false
            sql: |
              DO $$
              DECLARE
                demo_uuid TEXT := '00000000-0000-0000-0000-000000000002';
              BEGIN
                -- 1) Replace 'tenant_demo' with UUID (while columns still varchar)
                UPDATE tenants SET id = demo_uuid WHERE id = 'tenant_demo';
                UPDATE users SET tenant_id = demo_uuid WHERE tenant_id = 'tenant_demo';
                UPDATE feature_flags SET tenant_id = demo_uuid WHERE tenant_id = 'tenant_demo';
                UPDATE subscriptions SET tenant_id = demo_uuid WHERE tenant_id = 'tenant_demo';
                UPDATE webhook_endpoints SET tenant_id = demo_uuid WHERE tenant_id = 'tenant_demo';
                UPDATE webhook_deliveries SET tenant_id = demo_uuid WHERE tenant_id = 'tenant_demo';
                UPDATE reactivation_email_sent SET tenant_id = demo_uuid WHERE tenant_id = 'tenant_demo';
                UPDATE account_configs SET tenant_id = demo_uuid WHERE tenant_id = 'tenant_demo';
                UPDATE disputes SET tenant_id = demo_uuid WHERE tenant_id = 'tenant_demo';
                UPDATE gateway_configs SET tenant_id = demo_uuid WHERE tenant_id = 'tenant_demo';
                UPDATE invoices SET tenant_id = demo_uuid WHERE tenant_id = 'tenant_demo';
                UPDATE ledger_entries SET tenant_id = demo_uuid WHERE tenant_id = 'tenant_demo';
                UPDATE ledger_lines SET tenant_id = demo_uuid WHERE tenant_id = 'tenant_demo';
                UPDATE payment_intents SET tenant_id = demo_uuid WHERE tenant_id = 'tenant_demo';
                UPDATE payment_links SET tenant_id = demo_uuid WHERE tenant_id = 'tenant_demo';
                UPDATE payment_splits SET tenant_id = demo_uuid WHERE tenant_id = 'tenant_demo';
                UPDATE payouts SET tenant_id = demo_uuid WHERE tenant_id = 'tenant_demo';
                UPDATE reconciliation_discrepancies SET tenant_id = demo_uuid WHERE tenant_id = 'tenant_demo';
                UPDATE recurring_charges SET tenant_id = demo_uuid WHERE tenant_id = 'tenant_demo';
                UPDATE refunds SET tenant_id = demo_uuid WHERE tenant_id = 'tenant_demo';
                UPDATE saved_payment_methods SET tenant_id = demo_uuid WHERE tenant_id = 'tenant_demo';
                UPDATE outbox_events SET tenant_id = demo_uuid WHERE tenant_id = 'tenant_demo';

                -- 2) Drop FK constraints (only if they exist)
                ALTER TABLE account_configs DROP CONSTRAINT IF EXISTS account_configs_tenant_id_fkey;
                ALTER TABLE disputes DROP CONSTRAINT IF EXISTS disputes_tenant_id_fkey;
                ALTER TABLE feature_flags DROP CONSTRAINT IF EXISTS fk_feature_flags_tenant;
                ALTER TABLE gateway_configs DROP CONSTRAINT IF EXISTS gateway_configs_tenant_id_fkey;
                ALTER TABLE invoices DROP CONSTRAINT IF EXISTS invoices_tenant_id_fkey;
                ALTER TABLE ledger_entries DROP CONSTRAINT IF EXISTS ledger_entries_tenant_id_fkey;
                ALTER TABLE ledger_lines DROP CONSTRAINT IF EXISTS ledger_lines_tenant_id_fkey;
                ALTER TABLE payment_intents DROP CONSTRAINT IF EXISTS payment_intents_tenant_id_fkey;
                ALTER TABLE payment_links DROP CONSTRAINT IF EXISTS payment_links_tenant_id_fkey;
                ALTER TABLE payment_splits DROP CONSTRAINT IF EXISTS payment_splits_tenant_id_fkey;
                ALTER TABLE payouts DROP CONSTRAINT IF EXISTS payouts_tenant_id_fkey;
                ALTER TABLE reconciliation_discrepancies DROP CONSTRAINT IF EXISTS reconciliation_discrepancies_tenant_id_fkey;
                ALTER TABLE recurring_charges DROP CONSTRAINT IF EXISTS recurring_charges_tenant_id_fkey;
                ALTER TABLE refunds DROP CONSTRAINT IF EXISTS refunds_tenant_id_fkey;
                ALTER TABLE saved_payment_methods DROP CONSTRAINT IF EXISTS saved_payment_methods_tenant_id_fkey;
                ALTER TABLE subscriptions DROP CONSTRAINT IF EXISTS fk_subscriptions_tenant;
                ALTER TABLE users DROP CONSTRAINT IF EXISTS fk_users_tenant;
                ALTER TABLE webhook_endpoints DROP CONSTRAINT IF EXISTS fk_webhook_endpoints_tenant;

                -- 3) Convert tenants.id (PK) — skip if already uuid
                IF EXISTS (
                  SELECT 1 FROM information_schema.columns
                  WHERE table_name = 'tenants' AND column_name = 'id'
                    AND data_type = 'character varying'
                ) THEN
                  ALTER TABLE tenants ALTER COLUMN id TYPE uuid USING id::uuid;
                END IF;

                -- 4) Convert all tenant_id columns — skip if already uuid
                PERFORM 1; -- helper tables list
              END $$;

              -- Separate DO block for column conversions (cleaner for long lists)
              DO $$
              DECLARE
                t RECORD;
              BEGIN
                FOR t IN
                  SELECT table_name, column_name
                  FROM information_schema.columns
                  WHERE table_schema = 'public'
                    AND column_name = 'tenant_id'
                    AND data_type = 'character varying'
                LOOP
                  EXECUTE format(
                    'ALTER TABLE %I ALTER COLUMN %I TYPE uuid USING %I::uuid',
                    t.table_name, t.column_name, t.column_name
                  );
                END LOOP;
              END $$;

              -- 5) Re-add FK constraints
              DO $$
              BEGIN
                IF NOT EXISTS (SELECT 1 FROM information_schema.table_constraints WHERE constraint_name = 'account_configs_tenant_id_fkey') THEN
                  ALTER TABLE account_configs ADD CONSTRAINT account_configs_tenant_id_fkey FOREIGN KEY (tenant_id) REFERENCES tenants(id);
                END IF;
                IF NOT EXISTS (SELECT 1 FROM information_schema.table_constraints WHERE constraint_name = 'disputes_tenant_id_fkey') THEN
                  ALTER TABLE disputes ADD CONSTRAINT disputes_tenant_id_fkey FOREIGN KEY (tenant_id) REFERENCES tenants(id);
                END IF;
                IF NOT EXISTS (SELECT 1 FROM information_schema.table_constraints WHERE constraint_name = 'fk_feature_flags_tenant') THEN
                  ALTER TABLE feature_flags ADD CONSTRAINT fk_feature_flags_tenant FOREIGN KEY (tenant_id) REFERENCES tenants(id);
                END IF;
                IF NOT EXISTS (SELECT 1 FROM information_schema.table_constraints WHERE constraint_name = 'gateway_configs_tenant_id_fkey') THEN
                  ALTER TABLE gateway_configs ADD CONSTRAINT gateway_configs_tenant_id_fkey FOREIGN KEY (tenant_id) REFERENCES tenants(id);
                END IF;
                IF NOT EXISTS (SELECT 1 FROM information_schema.table_constraints WHERE constraint_name = 'invoices_tenant_id_fkey') THEN
                  ALTER TABLE invoices ADD CONSTRAINT invoices_tenant_id_fkey FOREIGN KEY (tenant_id) REFERENCES tenants(id);
                END IF;
                IF NOT EXISTS (SELECT 1 FROM information_schema.table_constraints WHERE constraint_name = 'ledger_entries_tenant_id_fkey') THEN
                  ALTER TABLE ledger_entries ADD CONSTRAINT ledger_entries_tenant_id_fkey FOREIGN KEY (tenant_id) REFERENCES tenants(id);
                END IF;
                IF NOT EXISTS (SELECT 1 FROM information_schema.table_constraints WHERE constraint_name = 'ledger_lines_tenant_id_fkey') THEN
                  ALTER TABLE ledger_lines ADD CONSTRAINT ledger_lines_tenant_id_fkey FOREIGN KEY (tenant_id) REFERENCES tenants(id);
                END IF;
                IF NOT EXISTS (SELECT 1 FROM information_schema.table_constraints WHERE constraint_name = 'payment_intents_tenant_id_fkey') THEN
                  ALTER TABLE payment_intents ADD CONSTRAINT payment_intents_tenant_id_fkey FOREIGN KEY (tenant_id) REFERENCES tenants(id);
                END IF;
                IF NOT EXISTS (SELECT 1 FROM information_schema.table_constraints WHERE constraint_name = 'payment_links_tenant_id_fkey') THEN
                  ALTER TABLE payment_links ADD CONSTRAINT payment_links_tenant_id_fkey FOREIGN KEY (tenant_id) REFERENCES tenants(id);
                END IF;
                IF NOT EXISTS (SELECT 1 FROM information_schema.table_constraints WHERE constraint_name = 'payment_splits_tenant_id_fkey') THEN
                  ALTER TABLE payment_splits ADD CONSTRAINT payment_splits_tenant_id_fkey FOREIGN KEY (tenant_id) REFERENCES tenants(id);
                END IF;
                IF NOT EXISTS (SELECT 1 FROM information_schema.table_constraints WHERE constraint_name = 'payouts_tenant_id_fkey') THEN
                  ALTER TABLE payouts ADD CONSTRAINT payouts_tenant_id_fkey FOREIGN KEY (tenant_id) REFERENCES tenants(id);
                END IF;
                IF NOT EXISTS (SELECT 1 FROM information_schema.table_constraints WHERE constraint_name = 'reconciliation_discrepancies_tenant_id_fkey') THEN
                  ALTER TABLE reconciliation_discrepancies ADD CONSTRAINT reconciliation_discrepancies_tenant_id_fkey FOREIGN KEY (tenant_id) REFERENCES tenants(id);
                END IF;
                IF NOT EXISTS (SELECT 1 FROM information_schema.table_constraints WHERE constraint_name = 'recurring_charges_tenant_id_fkey') THEN
                  ALTER TABLE recurring_charges ADD CONSTRAINT recurring_charges_tenant_id_fkey FOREIGN KEY (tenant_id) REFERENCES tenants(id);
                END IF;
                IF NOT EXISTS (SELECT 1 FROM information_schema.table_constraints WHERE constraint_name = 'refunds_tenant_id_fkey') THEN
                  ALTER TABLE refunds ADD CONSTRAINT refunds_tenant_id_fkey FOREIGN KEY (tenant_id) REFERENCES tenants(id);
                END IF;
                IF NOT EXISTS (SELECT 1 FROM information_schema.table_constraints WHERE constraint_name = 'saved_payment_methods_tenant_id_fkey') THEN
                  ALTER TABLE saved_payment_methods ADD CONSTRAINT saved_payment_methods_tenant_id_fkey FOREIGN KEY (tenant_id) REFERENCES tenants(id);
                END IF;
                IF NOT EXISTS (SELECT 1 FROM information_schema.table_constraints WHERE constraint_name = 'fk_subscriptions_tenant') THEN
                  ALTER TABLE subscriptions ADD CONSTRAINT fk_subscriptions_tenant FOREIGN KEY (tenant_id) REFERENCES tenants(id);
                END IF;
                IF NOT EXISTS (SELECT 1 FROM information_schema.table_constraints WHERE constraint_name = 'fk_users_tenant') THEN
                  ALTER TABLE users ADD CONSTRAINT fk_users_tenant FOREIGN KEY (tenant_id) REFERENCES tenants(id);
                END IF;
                IF NOT EXISTS (SELECT 1 FROM information_schema.table_constraints WHERE constraint_name = 'fk_webhook_endpoints_tenant') THEN
                  ALTER TABLE webhook_endpoints ADD CONSTRAINT fk_webhook_endpoints_tenant FOREIGN KEY (tenant_id) REFERENCES tenants(id);
                END IF;
              END $$;
