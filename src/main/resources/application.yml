spring:
  application:
    name: spring-saas-core
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5435/saascore}
    username: ${DB_USER:saascore}
    password: ${DB_PASS:saascore}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        format_sql: false
        default_schema: public
        jdbc.time_zone: UTC
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6382}
      timeout: 3s
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5675}
    username: ${RABBITMQ_USER:guest}
    password: ${RABBITMQ_PASS:guest}

# Railway / Render / Fly: expõem PORT; Spring usa SERVER_PORT se definido.
server:
  port: ${PORT:${SERVER_PORT:8080}}
  shutdown: graceful

app:
  version: ${APP_VERSION:1.0.0-SNAPSHOT}
  cors:
    allowed-origins: "*"
  auth:
    mode: ${AUTH_MODE:hs256}
    jwt:
      issuer: ${JWT_ISSUER:spring-saas-core}
      hs256-secret: ${JWT_SECRET:${JWT_HS256_SECRET:local-dev-secret-min-32-chars-for-hs256-signing}}
      hs256-secret-previous: ${JWT_SECRET_PREVIOUS:${JWT_HS256_SECRET_PREVIOUS:}}
      expiration-seconds: 3600
    oidc:
      issuer-uri: ${OIDC_ISSUER_URI:}
      jwk-set-uri: ${OIDC_JWK_SET_URI:}
      client-id: ${OIDC_CLIENT_ID:spring-saas-core}
      audience: ${OIDC_AUDIENCE:}
  webhook:
    max-attempts: 5
    dispatch-interval-ms: 10000
  outbox:
    publish-enabled: ${OUTBOX_PUBLISH_ENABLED:false}
    batch-size: 50
    lock-ttl-seconds: 60
    retry-max: 5
    dispatch-interval-ms: 5000
    exchange: saas.events
    routing-key-prefix: saas
  audit:
    retention-days: ${AUDIT_RETENTION_DAYS:90}
  rate-limit:
    free: 60
    pro: 300
    enterprise: 1000
  ai:
    enabled: ${AI_ENABLED:false}
    provider: ${AI_PROVIDER:openai}
    api-key: ${OPENAI_API_KEY:}
    base-url: ${AI_BASE_URL:https://api.openai.com/v1}
    model: ${AI_MODEL:gpt-4o-mini}
    max-tokens: ${AI_MAX_TOKENS:2048}
    temperature: ${AI_TEMPERATURE:0.3}
    timeout-seconds: ${AI_TIMEOUT:30}
  billing:
    provider: ${BILLING_PROVIDER:noop}
    stripe-secret-key: ${STRIPE_BILLING_SECRET_KEY:}
  # Email: convites, reset de senha.
  # provider: log | resend | smtp
  # EMAIL_PROVIDER vazio ou só espaços = tratado como log (API devolve temporaryPassword no Admin).
  # fail-on-delivery-error: se true (prod), convite falha quando envio falha; se false, loga e segue.
  email:
    provider: ${EMAIL_PROVIDER:log}
    resend-api-key: ${RESEND_API_KEY:}
    from: ${EMAIL_FROM:noreply@fluxe.com.br}
    from-name: ${EMAIL_FROM_NAME:}
    fail-on-delivery-error: ${EMAIL_FAIL_ON_DELIVERY_ERROR:false}
    frontend-url: ${FRONTEND_URL:http://localhost:4200}
    smtp:
      host: ${SMTP_HOST:}
      port: ${SMTP_PORT:587}
      username: ${SMTP_USER:}
      password: ${SMTP_PASSWORD:}
      auth: ${SMTP_AUTH:true}
      starttls: ${SMTP_STARTTLS:true}
      ssl:
        enabled: ${SMTP_SSL_ENABLED:false}
  dev:
    token-endpoint-enabled: false
  # Reativação: e-mail para tenants inativos (sem login há N dias)
  reactivation:
    cron: ${REACTIVATION_CRON:0 0 10 * * *}
    inactive-days: ${REACTIVATION_INACTIVE_DAYS:14}
    cooldown-days: ${REACTIVATION_COOLDOWN_DAYS:30}
  cache:
    # Se true, usa Redis para cache de GET /v1/tenants. Se false ou em erro de deserialização, usa memória.
    front-tenants-enabled: ${CACHE_FRONT_TENANTS_ENABLED:true}

resilience4j:
  circuitbreaker:
    instances:
      aiService:
        sliding-window-size: 10
        minimum-number-of-calls: 3
        failure-rate-threshold: 50
        wait-duration-in-open-state: 30s
        permitted-number-of-calls-in-half-open-state: 2
        slow-call-duration-threshold: 10s
        slow-call-rate-threshold: 80
      rabbitPublisher:
        sliding-window-size: 10
        minimum-number-of-calls: 3
        failure-rate-threshold: 50
        wait-duration-in-open-state: 30s
        permitted-number-of-calls-in-half-open-state: 2

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,cacheevict
  endpoint:
    health:
      show-details: when-authorized
      group:
        liveness:
          include: livenessState
          show-details: always
        readiness:
          include: readinessState,db
          show-details: always
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true
  otlp:
    tracing:
      endpoint: ${OTEL_EXPORTER_OTLP_TRACES_ENDPOINT:http://localhost:4318/v1/traces}
  tracing:
    enabled: ${MANAGEMENT_TRACING_ENABLED:true}
    sampling:
      probability: ${OTEL_TRACES_SAMPLER_ARG:1.0}
  prometheus:
    metrics:
      export:
        enabled: true

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /docs

logging:
  level:
    root: INFO
    com.union.solutions: DEBUG
    org.springframework.security: INFO
  pattern:
    console: "%d{ISO8601} [%thread] %-5level %logger{36} [cid=%X{correlationId:-}] [tid=%X{tenantId:-}] [traceId=%X{traceId:-}] [spanId=%X{spanId:-}] - %msg%n"
