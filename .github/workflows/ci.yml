name: CI

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  push:
    branches: [master, develop]
  pull_request:
    branches: [master, develop]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
      - name: Build and test
        run: |
          chmod +x mvnw
          ./mvnw -B -e package 2>&1 | tee build-output.txt; BUILD_RC=$?
          if [ $BUILD_RC -ne 0 ]; then
            echo '## Build Failed' >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            tail -80 build-output.txt >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
          fi
          exit $BUILD_RC
      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build-output.txt
      - name: Spotless check
        run: ./mvnw -B spotless:check
      - name: Validate OpenAPI spec exists
        run: test -f docs/api/openapi.json && echo "OpenAPI present"
      - name: Upload OpenAPI
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: openapi
          path: docs/api/openapi.json
