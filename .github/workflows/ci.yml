name: CI
on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven
      - name: Build
        run: |
          mvn --version
          mvn -B -e -DskipTests package 2>&1 | tee build-output.txt
          exit ${PIPESTATUS[0]}
      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build-output.txt
      - name: Spotless check
        run: mvn -B spotless:check
      - name: Validate OpenAPI spec exists
        run: test -f docs/api/openapi.json && echo "OpenAPI present"
      - name: Upload OpenAPI
        uses: actions/upload-artifact@v4
        with:
          name: openapi
          path: docs/api/openapi.json
