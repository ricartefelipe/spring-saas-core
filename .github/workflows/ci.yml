name: CI
on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven
      - name: Compile
        run: mvn -B compile test-compile
      - name: Spotless check
        run: mvn -B spotless:check
      - name: Package
        run: mvn -B -DskipTests package
      - name: Unit tests
        run: mvn -B test -Dtest='com.union.solutions.saascore.unit.**' -DfailIfNoTests=false
      - name: Validate OpenAPI spec exists
        run: test -f docs/api/openapi.json && echo "OpenAPI present"
      - name: Upload OpenAPI
        uses: actions/upload-artifact@v4
        with:
          name: openapi
          path: docs/api/openapi.json
      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: target/site/jacoco/
          if-no-files-found: ignore
